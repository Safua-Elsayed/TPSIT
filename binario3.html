<!DOCTYPE html>
<html>
<body>

    <h3>Indirizzo IP</h3>

    <input type="text" id="ip1" value="0" size="3"> .
    <input type="text" id="ip2" value="0" size="3"> .
    <input type="text" id="ip3" value="0" size="3"> .
    <input type="text" id="ip4" value="0" size="3">

    <br><br>

    Prefix Length:
    <input type="text" id="pl" value="24" size="3">

    <br><br>

    <button onclick="converti()">Converti</button>

    <p>IP in binario:</p>
    <p id="risultato"></p>

    <p>Subnet Mask decimale:</p>
    <p id="mask"></p>

    <script>
    function converti() {
        let risultato = "";
        let subnetMask = "";
        let PL = parseInt(document.getElementById("pl").value);

        if (isNaN(PL) || PL < 0 || PL > 32) {
            alert("Inserisci un PL tra 0 e 32");
            return;
        }

        for (let j = 1; j <= 4; j++) {
            let N = parseInt(document.getElementById("ip" + j).value);

            if (isNaN(N) || N < 0 || N > 255) {
                alert("Inserisci un numero tra 0 e 255");
                return;
            }

            let conversione = "";
            let i = 8;

            while (N > 0) {
                conversione = (N % 2) + conversione;
                N = parseInt(N / 2);
                i--;
            }

            for (let k = 0; k < i; k++) {
                conversione = "0" + conversione;
            }

            risultato += conversione + " ";

            let valore = 0;
            let valoreBit = 128;

            for (let k = 0; k < 8; k++) {
                if (PL > 0) {
                    valore += valoreBit;
                    PL--;
                }

                valoreBit = valoreBit / 2;
            }

            subnetMask += valore;

            if (j < 4) {
                subnetMask += ".";
            }
        }

        document.getElementById("risultato").innerHTML = risultato;
        document.getElementById("mask").innerHTML = subnetMask;
    }
    </script>

</body>
</html>
