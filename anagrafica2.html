
<!DOCTYPE html>
<html>
<body>

<h2>Inserimento dati personali</h2>

<form id="modulo">

    Nome: <input type="text" id="nome"><br><br>
    Cognome: <input type="text" id="cognome"><br><br>
    Età: <input type="number" id="eta"><br><br>

    Sesso:
    <input type="radio" name="sesso" value="Maschio"> Maschio
    <input type="radio" name="sesso" value="Femmina"> Femmina
    <br><br>

    Indirizzo: <input type="text" id="indirizzo"><br><br>
    Città: <input type="text" id="citta"><br><br>

    Provincia:
    <select id="provincia">
        <option>Milano</option>
        <option>Roma</option>
        <option>Catanzaro</option>
    </select>
    <br><br>

    Sport praticati:<br>
    <input type="checkbox" name="sport" value="Calcio"> Calcio
    <input type="checkbox" name="sport" value="Danza"> Danza
    <input type="checkbox" name="sport" value="Tennis"> Tennis
    <br><br>

    Commenti:<br>
    <textarea id="commenti"></textarea>
    <br><br>

    <input type="submit" value="Invia">

</form>

<div id="risultato"></div>

<script>

document.getElementById("modulo").onsubmit = function(event) {

    event.preventDefault();

    let nome = document.getElementById("nome").value;
    let cognome = document.getElementById("cognome").value;
    let eta = document.getElementById("eta").value;
    let sesso = document.querySelector('input[name="sesso"]:checked').value;
    let indirizzo = document.getElementById("indirizzo").value;
    let citta = document.getElementById("citta").value;
    let provincia = document.getElementById("provincia").value;
    let commenti = document.getElementById("commenti").value;

    let sport = document.querySelectorAll('input[name="sport"]:checked');
    let elenco = "";

    sport.forEach(function(s) {
        elenco += s.value + " ";
    });

    let tabella = "<table border='1'>" +
        "<tr><th>Campo</th><th>Valore</th></tr>" +
        "<tr><td>Nome</td><td>" + nome + "</td></tr>" +
        "<tr><td>Cognome</td><td>" + cognome + "</td></tr>" +
        "<tr><td>Età</td><td>" + eta + "</td></tr>" +
        "<tr><td>Sesso</td><td>" + sesso + "</td></tr>" +
        "<tr><td>Indirizzo</td><td>" + indirizzo + "</td></tr>" +
        "<tr><td>Città</td><td>" + citta + "</td></tr>" +
        "<tr><td>Provincia</td><td>" + provincia + "</td></tr>" +
        "<tr><td>Sport</td><td>" + elenco + "</td></tr>" +
        "<tr><td>Commenti</td><td>" + commenti + "</td></tr>" +
        "</table>";

    document.getElementById("risultato").innerHTML = tabella;

};

</script>

</body>
</html>
