<!DOCTYPE html>
  <HTML>
    <body>
      <h2>Dati Anagrafici</h2>
    Nome:
    <input type="text" id="nome"> <br><br>
    Cognome:
    <input type="text" id="cognome"> <br><br>
    Età:
    <input type="text" id="eta">
    <br><br>

    Sesso:
    <input type="radio" name="sesso" value="Maschio"> Maschio
    <input type="radio" name="sesso" value="Femmina"> Femmina <br><br>    

    Indirizzo:
    <input type="text" id="indirizzo"> <br><br>

    Provincia:
    <select id="provincia">
      <option value="Milano">Milano</option>
      <option value="Roma">Roma</option>
      <option value="Catanzaro">Catanzaro</option>
    </select> <br><br>

    Sport Praticati:
    <input type="checkbox" name="sport" value="Calcio"> Calcio
    <input type="checkbox" name="sport" value="Basket"> Basket
    <input type="checkbox" name="sport" value="Tennis"> Tennis
    <input type="checkbox" name="sport" value="Danza"> Danza <br><br>

    Commmenti(opzionali):
    <textarea id="commenti" rows="4" cols="50"></textarea> <br><br>
    </body>
  </HTML>
